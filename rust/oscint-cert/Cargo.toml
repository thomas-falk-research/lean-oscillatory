[package]
name = "oscint-cert"
version = "0.2.0"
edition = "2021"
rust-version = "1.79"
description = "Independent checker for OscInt certificates (contract 0.1, revision 3), exact rational interval arithmetic only"
license = "Apache-2.0"
publish = false

[[bin]]
name = "oscint-cert"
path = "src/main.rs"

[lib]
name = "oscint_cert"
path = "src/lib.rs"

[dependencies]
num-bigint = "=0.5.1"
num-integer = "=0.1.47"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
serde_json = "=1.0.154"

[profile.release]
opt-level = 3
overflow-checks = true
debug-assertions = false
panic = "unwind"

[profile.test]
opt-level = 2
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
