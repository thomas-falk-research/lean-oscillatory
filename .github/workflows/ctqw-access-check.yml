name: ctqw-access-check

# Read-only access check for the registered hardware experiment (docs/prereg/2026-11-16-CTQW-chain.md, Addendum 1).
# It authenticates with the repository's secrets, reads the plan, the usage allowance and the device list, and
# compiles the registered circuits locally to estimate device time. IT SUBMITS NO JOB: the script it runs has no
# code path that sends a circuit to a device, and this workflow runs nothing else.
#
# Trigger: a push to the one branch below that changes the trigger file. Pull requests, forks and other branches
# cannot start it, so the secrets are never exposed to code from outside the repository. The log and the artifact
# are public: the script prints no key, no instance identifier and no account detail.

on:
  push:
    branches:
      - claude/dreamy-ptolemy-7hs5wb
    paths:
      - experiments/ctqw-chain/hardware/CHECK-TRIGGER

permissions:
  contents: read

concurrency:
  group: ctqw-access-check
  cancel-in-progress: false

jobs:
  access-check:
    if: ${{ github.repository == 'thomas-falk-research/lean-oscillatory' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python environment
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/q"
          "$RUNNER_TEMP/q/bin/pip" install --quiet --require-hashes --only-binary=:all: \
            -r experiments/ctqw-chain/hardware/requirements-py312.txt
      - name: Self-test on a simulated device (no credentials)
        run: |
          "$RUNNER_TEMP/q/bin/python" experiments/ctqw-chain/hardware/check_access.py --fake FakeTorino > selftest.json
          cat selftest.json
      - name: Access check (read-only; submits nothing)
        env:
          QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
          QISKIT_IBM_INSTANCE: ${{ secrets.QISKIT_IBM_INSTANCE }}
        run: |
          set +e
          "$RUNNER_TEMP/q/bin/python" experiments/ctqw-chain/hardware/check_access.py > access-check.json 2> access-check.err
          rc=$?
          cat access-check.json
          echo "stderr lines: $(wc -l < access-check.err)"
          exit $rc
      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctqw-access-check
          path: |
            selftest.json
            access-check.json
          if-no-files-found: warn
