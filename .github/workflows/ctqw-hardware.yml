name: ctqw-hardware

# The registered hardware experiment (docs/prereg/2026-11-16-CTQW-chain.md, Addenda 1 and 2). Nothing here runs
# unless experiments/ctqw-chain/hardware/SUBMIT-TRIGGER changes on the one branch below; its last line says what.
#
# Where the approval is. The credentials are meant to be ENVIRONMENT secrets of the environment "ibm-hardware",
# not repository secrets. Every job that needs them declares that environment, so GitHub holds the job until a
# required reviewer releases it. The job "gate" refuses to let it start unless the environment exists, has a
# required-reviewers rule and does not let administrators bypass it, and unless no copy of the credentials is
# visible to a job without the environment (a repository-level copy would be readable by any workflow on any
# branch). What this workflow cannot check: who the reviewers are, whether the person who releases a job is the
# person who pushed it (pushes of the lead arrive under the owner's account), and whether copies of the
# credentials exist outside GitHub.
# The variable CTQW_GUARD set below is a guard against running the script by accident; it is not an approval.
#
# Pull requests, forks and other branches cannot start this workflow. Logs and artifacts are public: the scripts
# print no key, no instance identifier, no account detail and no raw error trace (standard error is not shown).

on:
  push:
    branches:
      - claude/dreamy-ptolemy-7hs5wb
    paths:
      - experiments/ctqw-chain/hardware/SUBMIT-TRIGGER

permissions:
  contents: read

concurrency:
  group: ctqw-hardware
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.repository == 'thomas-falk-research/lean-oscillatory' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      action: ${{ steps.read.outputs.action }}
      repetition: ${{ steps.read.outputs.repetition }}
      attempt: ${{ steps.read.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the instruction (the last line, exactly)
        id: read
        run: |
          line="$(tail -n 1 experiments/ctqw-chain/hardware/SUBMIT-TRIGGER)"
          printf 'last line: [%s]\n' "$line"
          action=""; rep=0; att=1
          if [[ "$line" == "none" ]]; then action=none
          elif [[ "$line" == "check" ]]; then action=check
          elif [[ "$line" == "dryrun" ]]; then action=dryrun
          elif [[ "$line" =~ ^submit\ ([1-5])$ ]]; then action=submit; rep="${BASH_REMATCH[1]}"
          elif [[ "$line" =~ ^submit\ ([1-5])\ attempt\ ([2-9])$ ]]; then action=submit; rep="${BASH_REMATCH[1]}"; att="${BASH_REMATCH[2]}"
          elif [[ "$line" =~ ^collect\ ([1-5])$ ]]; then action=collect; rep="${BASH_REMATCH[1]}"
          elif [[ "$line" =~ ^locate\ ([1-5])$ ]]; then action=locate; rep="${BASH_REMATCH[1]}"
          else echo "REFUSED: the last line is not an instruction. Nothing runs."; exit 1
          fi
          {
            echo "action=$action"
            echo "repetition=$rep"
            echo "attempt=$att"
          } >> "$GITHUB_OUTPUT"
          echo "action: $action, repetition: $rep, attempt: $att"

  gate:
    needs: plan
    if: ${{ needs.plan.outputs.action != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: No copy of the credentials may be readable without the environment
        env:
          TOKEN_VISIBLE_HERE: ${{ secrets.QISKIT_IBM_TOKEN != '' }}
          INSTANCE_VISIBLE_HERE: ${{ secrets.QISKIT_IBM_INSTANCE != '' }}
        run: |
          # This job declares no environment, so it sees repository and organisation secrets only.
          echo "key visible without the environment: $TOKEN_VISIBLE_HERE; instance visible: $INSTANCE_VISIBLE_HERE"
          if [[ "$TOKEN_VISIBLE_HERE" != "false" || "$INSTANCE_VISIBLE_HERE" != "false" ]]; then
            echo "REFUSED: a repository-level copy of a credential exists; any workflow could read it without approval."
            echo "Keep the two secrets in the environment ibm-hardware only. Nothing runs."
            exit 1
          fi
      - name: The approval environment must exist, require a reviewer and allow no bypass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/ibm-hardware")" \
            || { echo "REFUSED: the environment ibm-hardware does not exist or cannot be read. Nothing runs."; exit 1; }
          rules="$(jq -r '[.protection_rules[]?.type] | join(",")' <<<"$json")"
          bypass="$(jq -r '.can_admins_bypass' <<<"$json")"
          reviewers="$(jq -r '[.protection_rules[]? | select(.type=="required_reviewers") | .reviewers[]?] | length' <<<"$json")"
          echo "protection rules: ${rules:-none}; reviewers listed: $reviewers; administrators can bypass: $bypass"
          case ",$rules," in
            *,required_reviewers,*) ;;
            *) echo "REFUSED: ibm-hardware has no required-reviewers rule. Nothing runs."; exit 1 ;;
          esac
          [[ "$reviewers" -ge 1 ]] || { echo "REFUSED: no reviewer is listed. Nothing runs."; exit 1; }
          [[ "$bypass" == "false" ]] || { echo "REFUSED: administrators can bypass the rule. Nothing runs."; exit 1; }
          echo "ok: a reviewer must release the next job"

  run:
    needs: [plan, gate]
    if: ${{ needs.plan.outputs.action != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ibm-hardware
    env:
      ACTION: ${{ needs.plan.outputs.action }}
      REP: ${{ needs.plan.outputs.repetition }}
      ATT: ${{ needs.plan.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/q"
          "$RUNNER_TEMP/q/bin/pip" install --quiet --require-hashes --only-binary=:all: \
            -r experiments/ctqw-chain/hardware/requirements-py312.txt
      - name: Run the one requested action
        env:
          QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
          QISKIT_IBM_INSTANCE: ${{ secrets.QISKIT_IBM_INSTANCE }}
        run: |
          set +e
          py="$RUNNER_TEMP/q/bin/python"
          dir=experiments/ctqw-chain/hardware
          case "$ACTION" in
            check)   "$py" "$dir/check_access.py" > stdout.txt 2> stderr.txt ;;
            dryrun)  CTQW_GUARD="dry run" "$py" "$dir/run_hardware.py" dryrun --out dryrun.json > stdout.txt 2> stderr.txt ;;
            submit)  CTQW_GUARD="submit repetition $REP attempt $ATT" "$py" "$dir/run_hardware.py" submit "$REP" "$ATT" \
                       --out "submit-rep$REP-a$ATT.json" > stdout.txt 2> stderr.txt ;;
            collect) "$py" "$dir/run_hardware.py" collect "$REP" --out "result-rep$REP.json" > stdout.txt 2> stderr.txt ;;
            locate)  "$py" "$dir/run_hardware.py" locate "$REP" > stdout.txt 2> stderr.txt ;;
            *)       echo "unknown action" > stdout.txt; false ;;
          esac
          rc=$?
          cat stdout.txt
          echo "exit code: $rc; lines on standard error (not shown): $(wc -l < stderr.txt)"
          exit $rc
      - name: Keep the record
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctqw-${{ needs.plan.outputs.action }}-rep${{ needs.plan.outputs.repetition }}-a${{ needs.plan.outputs.attempt }}
          path: |
            dryrun.json
            submit-rep*.json
            result-rep*.json
          if-no-files-found: ignore
