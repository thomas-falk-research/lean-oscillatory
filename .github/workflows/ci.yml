name: ci

# Fast feedback on every pull request and on main (docs/decisions/2026-11-08-ci-release-review.md, option B).
# The full replay is verify.yml; releases: release-candidate.yml and post-release.yml. Jobs here run in parallel.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a newer push to the same pull request supersedes the older run; runs on main are never cancelled
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # docs-check accepts cited paths found in history (tools/check_docs.py)
      - uses: ./.github/actions/setup-lean
      - name: Rust toolchain pinned in tools/rust-toolchain.toml
        run: cd tools && rustup toolchain install
      - name: Incremental build cache (Lake re-checks every trace; evidence builds clean in verify.yml)
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .lake/build
          key: oscint-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: oscint-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: make quick (build, guard, axiom audit, statement types, Mathlib names, Gamma-free, statements, API index, examples)
        run: make quick

  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # release-pin check 4 reads history
      - name: Rust unit tests of the trust-chain tools
        run: cd tools && rustup toolchain install && cargo test --release --locked --quiet
      - name: release-pin and release-preflight self-tests, and every pinned release tag against its notes
        run: |
          tools/release_preflight.sh --self-test
          tools/check_release_pin.sh --self-test
          tools/check_release_pin.sh "https://github.com/${{ github.repository }}"
      - name: API index generator self-test (6 planted defects) and drift check
        run: tools/test_gen_api.sh && python3 -I tools/gen_api.py --check .
      - name: REUSE 3.3 licensing information (reuse lint) and CITATION.cff schema (cffconvert)
        run: |
          python3 -m venv /tmp/meta
          /tmp/meta/bin/pip install --quiet --require-hashes --no-deps -r tools/requirements-ci-build.txt
          /tmp/meta/bin/pip install --quiet --require-hashes --no-build-isolation -r tools/requirements-ci.txt
          /tmp/meta/bin/reuse lint
          /tmp/meta/bin/cffconvert --validate -i CITATION.cff
      - name: actionlint (workflow syntax and shellcheck of every run block)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          sudo apt-get install -y -q shellcheck
          "$(go env GOPATH)/bin/actionlint"

  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-lean
        with:
          mathlib-cache: "false"
      - name: Build the example consumer (examples/consumer, OscInt as a Lake dependency of this checkout)
        working-directory: examples/consumer
        run: |
          for _ in 1 2 3; do lake exe cache get && break; sleep 30; done
          lake build
      - name: Downstream checker (tools/oscint_check.py) with recomputed commitments
        working-directory: examples/consumer
        run: |
          python3 ../../tools/oscint_check.py --oscint ../.. \
            --statement OscInt.Statements.D4LimitStatement --statement OscInt.Statements.StationaryPhaseStatement \
            --expect-sha256 "$(sha256sum ../../stamps/statements.json | cut -d' ' -f1)" --commitments
      - name: Negative controls for the checker (each must be rejected with its own message)
        working-directory: examples/consumer
        run: ../../tools/test_oscint_check.sh
