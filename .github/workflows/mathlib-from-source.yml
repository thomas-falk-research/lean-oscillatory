name: mathlib-from-source

# On demand: build Mathlib from source at the pinned commit (no binary cache) and recompute the commitments, so the
# commitments do not rest on the Mathlib binary cache alone (ROADMAP §6).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  from-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-lean
        with:
          mathlib-cache: "false"
      - run: cd tools && rustup toolchain install
      - name: Build Mathlib and the library from source (no cache get)
        run: |
          set -o pipefail
          lake build Mathlib 2>&1 | tee build-from-source.log > /dev/null
          lake build 2>&1 | tee build-library.log > /dev/null
          tail -1 build-library.log
          tail -1 build-from-source.log
      - name: Check Mathlib was compiled here, not fetched or replayed
        run: |
          built=$(grep -cE "Built Mathlib\." build-from-source.log || true)
          other=$(grep -E "(Replayed|Fetched|Downloaded|Unpacked) Mathlib\." build-from-source.log | head -5 || true)
          echo "Mathlib modules compiled in this job: $built"
          test "$built" -gt 7000
          test -z "$other" || { echo "not compiled here: $other"; exit 1; }
      - name: Recompute commitments; make commit enforces the pinned stamps
        run: make commit
