name = "oscint"
version = "0.7.0"
description = "Machine-checked uniform oscillatory-integral estimates with explicit constants: van der Corput, stationary phase, fold, cusp and D4 umbilic bounds, lattice Schrödinger kernels and groups, quantum walks, the trapezoidal rule, Kusmin–Landau."
keywords = ["analysis", "oscillatory-integrals", "stationary-phase", "van-der-corput", "dispersive-estimates", "explicit-constants", "mathlib"]
homepage = "https://doi.org/10.5281/zenodo.24021328"
license = "Apache-2.0"
licenseFiles = ["LICENSE", "NOTICE"]
readmeFile = "README.md"
defaultTargets = ["OscInt", "Blueprint"]
# Our files are plain (non-module) Lean files that import Mathlib, which uses the module system. The statement files
# are stamped and cannot gain a `module` header without a re-freeze (docs/ROADMAP.md §3), so we declare the mix
# knowingly; this silences Lake's per-import warning and does not change how anything is compiled.
allowNonModules = true

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "OscInt"

[[lean_lib]]
name = "Blueprint"

[[lean_lib]]
name = "Challenge"

[[lean_exe]]
name = "oscint-commit-env"
srcDir = "tools/lean"
root = "CommitEnv"
supportInterpreter = true
