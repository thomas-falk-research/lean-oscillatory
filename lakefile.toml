name = "oscint"
version = "0.1.0"
defaultTargets = ["OscInt", "Blueprint"]
# Our files are plain (non-module) Lean files that import Mathlib, which uses the module system. The statement files
# are stamped and cannot gain a `module` header without a re-freeze (docs/ROADMAP.md §3), so we declare the mix
# knowingly; this silences Lake's per-import warning and does not change how anything is compiled.
allowNonModules = true

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "OscInt"

[[lean_lib]]
name = "Blueprint"

[[lean_lib]]
name = "Challenge"

[[lean_exe]]
name = "oscint-commit-env"
srcDir = "tools/lean"
root = "CommitEnv"
supportInterpreter = true
